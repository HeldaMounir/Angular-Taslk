<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4"
     (click)="close()">

  <div class="bg-white dark:bg-[#2B2C37] rounded-2xl w-full max-w-[480px] p-8 shadow-2xl"
       (click)="$event.stopPropagation()">

    <h2 class="text-[#EA5555] font-bold text-lg mb-6">
      {{ title }}
    </h2>

    <p class="text-[#828FA3] text-[13px] leading-relaxed mb-6">
      {{ message }}
    </p>

    <div class="flex gap-4">
      <button
        (click)="confirm()"
        class="flex-1 py-3 rounded-full bg-[#EA5555] hover:bg-[#FF9898]
               text-white font-bold text-[13px] transition-colors">
        Delete
      </button>
      <button
        (click)="close()"
        class="flex-1 py-3 rounded-full bg-[#635FC7]/10 hover:bg-[#635FC7]/20
               text-[#635FC7] font-bold text-[13px] transition-colors">
        Cancel
      </button>
    </div>

  </div>
</div>
