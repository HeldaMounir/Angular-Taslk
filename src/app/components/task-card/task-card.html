<div (click)="onClick()"
     class="bg-white dark:bg-[#2B2C37] rounded-xl px-4 py-6 
            shadow-md cursor-pointer group
            hover:-translate-y-0.5 transition-transform duration-150">
  <h3 class="text-black dark:text-white font-bold text-[15px] mb-2
             group-hover:text-[#635FC7] transition-colors">
    {{ task.title }}
  </h3>
  <p class="text-[#828FA3] text-xs font-bold">
    {{ completedCount }} of {{ totalCount }} subtasks
  </p>
</div>
